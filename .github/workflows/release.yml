name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build standalone Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name localify --paths src scripts/entry_gui.py
          Move-Item dist/localify.exe dist/localify-windows.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/localify-windows.exe
          generate_release_notes: true
